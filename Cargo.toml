[package]
name = "bunny_skylines"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace]
members = ["tools/art_export", "tools/sound_gen", "tools/texture_gen"]

[dependencies]
bevy = { version = "0.20", features = ["wav"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }

# system_font_discovery: Die eingebaute Schrift hat keine Umlaute, also Systemschriften nutzen.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.20", features = ["file_watcher", "system_font_discovery"] }

# Im Browser: Spielstände im localStorage, Zufall aus der Uhr des Browsers.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage"] }

# Bevy-Systeme haben naturgemäß viele Parameter und lange Query-Typen.
[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[features]
# Schnellere Kompilierzeiten beim Entwickeln: `cargo run --features dev`
dev = ["bevy/dynamic_linking"]

# Eigener Code leicht optimiert, Abhängigkeiten voll optimiert:
# so bleibt das Spiel im Debug-Build flüssig, ohne dass jede Änderung lange baut.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

# Für den Browser: kleiner statt schneller, damit die Seite zügig lädt.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
strip = true
