# Die Android-Fassung: dieselbe Spiel-Bibliothek, verpackt als .so für die GameActivity.
# Gebaut wird sie mit cargo-ndk, verpackt mit Gradle im Ordner android/.
[package]
name = "bau_nen_bau_mobile"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bau_nen_bau = { path = ".." }
bevy = { version = "0.20", default-features = false, features = ["android-game-activity"] }
