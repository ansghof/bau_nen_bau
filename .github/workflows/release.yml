# Baut das Spiel zum Herunterladen: Windows, Linux, macOS und die Android-APK.
# Nach jedem Push auf main liegen sie als Artefakte am Lauf (Actions → „Builds“ → Lauf → Artifacts);
# bei einem Versions-Tag wie v0.2.0 kommen sie zusätzlich in ein GitHub-Release.
name: Builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Ein neuer Push auf main löst den alten Lauf ab; Tags laufen immer zu Ende.
concurrency:
  group: fassungen-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            exe: bau_nen_bau.exe
          - os: ubuntu-latest
            name: linux
            exe: bau_nen_bau
          - os: macos-latest
            name: macos
            exe: bau_nen_bau
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Bibliotheken für Ton, Fenster und Eingabe
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libfontconfig-dev

      - name: Bauen
        shell: bash
        run: bash .github/bau.sh cargo build --release

      # Das Spiel sucht seine Bilder und Töne im Ordner assets neben dem Programm.
      - name: Zusammenpacken
        shell: bash
        run: |
          mkdir -p "dist/BauNenBau"
          cp "target/release/${{ matrix.exe }}" dist/BauNenBau/
          cp -r assets dist/BauNenBau/

      - uses: actions/upload-artifact@v5
        with:
          name: bau-nen-bau-${{ matrix.name }}
          path: dist

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      # Fast alle Android-Geräte der letzten Jahre sind arm64.
      - name: Spiel für Android bauen
        # Plattform 28 wie minSdk in android/app/build.gradle; erst ab 26 gibt es AAudio für den Ton.
        # Das neueste NDK des Runners; die Variable steht nur in der Shell, nicht im env-Kontext.
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          bash .github/bau.sh cargo ndk -t arm64-v8a --platform 28 -o android/app/src/main/jniLibs build --release -p bau_nen_bau_mobile

      # Mit Schlüssel aus den Secrets lässt sich jede neue APK über die alte installieren;
      # ohne wird sie mit dem Debug-Schlüssel des Laufs signiert.
      - name: Signierschlüssel
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein ANDROID_KEYSTORE_BASE64-Secret: die APK ist nur mit einem Debug-Schlüssel signiert."
          fi

      - name: APK packen
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bash .github/bau.sh gradle -p android assembleRelease
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/BauNenBau.apk

      - uses: actions/upload-artifact@v5
        with:
          name: bau-nen-bau-android
          path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: fassungen

      - name: Zip-Dateien
        run: |
          cd fassungen
          # Artefakte verlieren das Ausführbar-Recht; im Zip soll es wieder stimmen.
          chmod +x bau-nen-bau-linux/BauNenBau/bau_nen_bau bau-nen-bau-macos/BauNenBau/bau_nen_bau
          for system in windows linux macos; do
            (cd "bau-nen-bau-$system" && zip -qr "../BauNenBau-$system.zip" BauNenBau)
          done
          mv bau-nen-bau-android/BauNenBau.apk .

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            fassungen/BauNenBau-*.zip
            fassungen/BauNenBau.apk
