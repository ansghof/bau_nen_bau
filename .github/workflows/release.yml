# Baut die Fassungen zum Herunterladen: Windows, Linux, macOS und die Android-APK.
# Nach jedem Push auf main liegen sie als Artefakte am Lauf (Actions → „Fassungen“ → Lauf → Artifacts);
# bei einem Versions-Tag wie v0.2.0 kommen sie zusätzlich in ein GitHub-Release.
name: Fassungen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Ein neuer Push auf main löst den alten Lauf ab; Tags laufen immer zu Ende.
concurrency:
  group: fassungen-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            exe: bunny_skylines.exe
          - os: ubuntu-latest
            name: linux
            exe: bunny_skylines
          - os: macos-latest
            name: macos
            exe: bunny_skylines
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Bibliotheken für Ton, Fenster und Eingabe
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Bauen
        shell: bash
        run: bash .github/bau.sh cargo build --release

      # Das Spiel sucht seine Bilder und Töne im Ordner assets neben dem Programm.
      - name: Zusammenpacken
        shell: bash
        run: |
          mkdir -p "dist/BunnySkylines"
          cp "target/release/${{ matrix.exe }}" dist/BunnySkylines/
          cp -r assets dist/BunnySkylines/

      - uses: actions/upload-artifact@v4
        with:
          name: bunny-skylines-${{ matrix.name }}
          path: dist

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Fast alle Android-Geräte der letzten Jahre sind arm64.
      - name: Spiel für Android bauen
        # Das neueste NDK des Runners; die Variable steht nur in der Shell, nicht im env-Kontext.
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          bash .github/bau.sh cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release -p bunny_skylines_mobile

      # Mit Schlüssel aus den Secrets lässt sich jede neue APK über die alte installieren;
      # ohne wird sie mit dem Debug-Schlüssel des Laufs signiert.
      - name: Signierschlüssel
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein ANDROID_KEYSTORE_BASE64-Secret: die APK ist nur mit einem Debug-Schlüssel signiert."
          fi

      - name: APK packen
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bash .github/bau.sh gradle -p android assembleRelease
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/BunnySkylines.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bunny-skylines-android
          path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: fassungen

      - name: Zip-Dateien
        run: |
          cd fassungen
          # Artefakte verlieren das Ausführbar-Recht; im Zip soll es wieder stimmen.
          chmod +x bunny-skylines-linux/BunnySkylines/bunny_skylines bunny-skylines-macos/BunnySkylines/bunny_skylines
          for system in windows linux macos; do
            (cd "bunny-skylines-$system" && zip -qr "../BunnySkylines-$system.zip" BunnySkylines)
          done
          mv bunny-skylines-android/BunnySkylines.apk .

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            fassungen/BunnySkylines-*.zip
            fassungen/BunnySkylines.apk
