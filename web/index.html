<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Burrow Boroughs – Bau ’nen Bau!</title>
  <!-- Als App auf den Startbildschirm: Symbol, Farbe und Vollbild kommen aus dem Manifest. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="symbol-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#faf2db">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Burrow Boroughs">
  <style>
    html, body { margin: 0; height: 100%; background: #faf2db; overflow: hidden; }
    /* Finger gehören dem Spiel: kein Verschieben, Zoomen oder Markieren der Seite. */
    #spiel {
      display: block; width: 100%; height: 100%; outline: none;
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    #drehen {
      display: none; position: fixed; inset: 0; z-index: 10; background: #faf2db;
      align-items: center; justify-content: center; text-align: center; padding: 24px;
      font: 20px "Segoe UI", "Noto Sans", sans-serif; color: #5a4632;
    }
    /* Auf Handys im Hochformat ist kein Platz für Karte und Werkzeugleiste. */
    @media (orientation: portrait) and (pointer: coarse) and (max-width: 700px) {
      #drehen { display: flex; }
    }
    #laden {
      position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px;
      align-items: center; justify-content: center;
      font: 20px "Segoe UI", "Noto Sans", sans-serif; color: #5a4632;
    }
    #laden small { font-size: 15px; opacity: 0.7; }
  </style>
</head>
<body>
  <canvas id="spiel" tabindex="0"></canvas>
  <div id="drehen">Dreh dein Gerät bitte quer, dann passt der ganze Bau auf den Bildschirm.</div>
  <div id="laden">
    <div>Die Kaninchen graben sich zu dir durch …</div>
    <small>Das erste Laden dauert einen Moment.</small>
  </div>
  <script>
    // Browser lassen Töne erst nach einem Klick oder Tastendruck zu. Bevy legt seinen AudioContext
    // schon beim Start an, der dann stumm bleibt; also merken wir uns jeden und wecken ihn bei der
    // ersten Eingabe auf.
    (() => {
      const contexts = [];
      const Original = window.AudioContext || window.webkitAudioContext;
      if (!Original) return;
      const Tracked = new Proxy(Original, {
        construct(target, args) {
          const context = new target(...args);
          contexts.push(context);
          return context;
        },
      });
      window.AudioContext = Tracked;
      window.webkitAudioContext = Tracked;
      const wake = () => contexts.forEach((context) => context.state !== "running" && context.resume());
      for (const event of ["pointerdown", "keydown", "touchstart"]) {
        document.addEventListener(event, wake, { capture: true });
      }
    })();
  </script>
  <script type="module">
    import init from "./burrow_boroughs.js";
    const laden = document.getElementById("laden");
    const spiel = document.getElementById("spiel");
    // Das Herunterladen dauert; ist das Spiel gestartet, kommt der Hinweis weg.
    const started = () => { laden.remove(); spiel.focus(); };
    // Langes Drücken soll kein Kontextmenü öffnen.
    spiel.addEventListener("contextmenu", (event) => event.preventDefault());
    // Der Service Worker hält das Spiel für den Start ohne Netz bereit.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
    init().then(started, (error) => {
      // Bevy übergibt die Schleife dem Browser über eine Ausnahme; das ist kein echter Fehler.
      if (String(error).includes("Using exceptions for control flow")) {
        started();
      } else {
        laden.textContent = "Das Spiel konnte nicht starten: " + error;
        throw error;
      }
    });
  </script>
</body>
</html>
